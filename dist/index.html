<!doctype html>
<html lang="fr">
  <head>
    <!-- Head reduit aux balises globales : title, description, canonical,
         hreflang, Open Graph, Twitter et JSON-LD sont rendus PAR ROUTE
         dans les composants React (Seo.jsx + StructuredData.jsx).
         Ne pas les redeclarer ici : doublons. -->
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="WMWSo7RF5_mGlawHVf3VNkngI2hwdhwZXlKdOVR6ZhM" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- Prechargement de l'image hero : c'est l'element LCP de la page.
         Sans cette ligne, le navigateur ne la decouvre qu'apres avoir
         execute tout le bundle React. -->
    <link
      rel="preload"
      as="image"
      href="/images/sofia/hero-cathedrale.jpg"
      fetchpriority="high"
    />

    <!-- Plus de preconnect Google Fonts : les polices sont desormais
         auto-hebergees (voir src/index.css). -->
    <script type="module" crossorigin src="/assets/index-Bg0x2pZT.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DYZJvhwW.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
